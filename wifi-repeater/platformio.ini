; WiFi NAT Repeater — ESP32 (Adafruit HUZZAH32)
; Connects to upstream AP as STA, creates local AP with NAT forwarding.

[env:huzzah32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = featheresp32
framework = arduino

upload_speed = 921600
upload_port = COM5
monitor_speed = 115200
